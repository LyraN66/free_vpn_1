name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK lisanslarını kabul et
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
      - name: Debug APK derle
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: FreeVPN-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: APK'yi Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FreeVPN.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum FreeVPN.apk --title "Free VPN (son sürüm)" --notes "Telefona kurmak için FreeVPN.apk dosyasını indirin."
